name: Backend tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # A throwaway MySQL next to the job, reachable on localhost:3306
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          # The app user gets full rights on this DB, which pytest drops and recreates
          MYSQL_DATABASE: praying_mantis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s

    # Same variables as backend/.env; the tests use "<DB_NAME>_test"
    env:
      DB_USER: app
      DB_PASSWORD: app
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: praying_mantis
      # Test-only value, not a real secret
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest

      # Fails if a model changed without a migration. pytest left the test DB at head.
      - name: Check models and migrations are in sync
        run: alembic check
        env:
          DB_NAME: praying_mantis_test

  docker-image:
    # The deploy builds backend/Dockerfile; catch a broken build here instead
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: docker build -t praying-mantis-backend backend

      - name: The image contains the app and no local secrets
        run: |
          docker run --rm praying-mantis-backend sh -c '
            test -f app/main.py && test -x start.sh && test ! -e .env && [ "$(id -u)" != 0 ]'
