      Review this synthetic Next.js App Router component. Identify defects only. Code:
      "use client"; import { useState } from "react";
      export default function BatchCheck() { const [iban, setIban] = useState(""); const [result, setResult] = useState<any>(null);
      async function check() { setResult(await (await fetch("/api/batches/validate", { method: "POST", body: JSON.stringify({ iban }) })).json()) }
      return (<div><input value={iban} onChange={(event) => setIban(event.target.value)} placeholder="IBAN" />
      <div className="btn" onClick={check}>Validate</div>{result ? <p>{result.status}</p> : null}</div>) }
      Return exactly one JSON object whose findings array holds plain string ids, like {"findings":["first-id","second-id"]}.
      Every finding must be one of: fetch-in-client-component, clickable-div, missing-input-label, untyped-response,
      missing-live-region, wrong-http-method. Do not use Markdown.
