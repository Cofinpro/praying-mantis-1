name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Served from https://<owner>.github.io/<repo>/, so assets need the repo name as base path
      - run: pnpm build --base=/${{ github.event.repository.name }}/
        env:
          # The live site talks to the backend on Render (BE-7.1). Repo variables (Settings → Secrets and
          # variables → Actions → Variables) override both, e.g. VITE_USE_MOCKS=true for a mock-only demo.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://praying-mantis-api.onrender.com' }}
          VITE_USE_MOCKS: ${{ vars.VITE_USE_MOCKS || 'false' }}
          # The Render backend runs the seed data, so show "Local seed users: password123" on the login page
          VITE_SHOW_SEED_HINT: 'true'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
