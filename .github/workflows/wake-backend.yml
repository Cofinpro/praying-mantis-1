# Render's free plan puts the backend to sleep after 15 idle minutes, and a sleeping
# process can't send reminders. This wakes it on working-day mornings and afternoons;
# the reminder loop's first turn after waking sends whatever is due (see app/scheduler.py).
name: Wake the backend

on:
  schedule:
    - cron: "0 7,16 * * 1-5" # 07:00 and 16:00 UTC, Monday to Friday
  workflow_dispatch: # a "Run workflow" button in the Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Call the health check (a cold start takes about a minute)
        run: curl --fail --silent --show-error --retry 5 --retry-delay 20 --max-time 120 https://praying-mantis-api.onrender.com/api/health/db
