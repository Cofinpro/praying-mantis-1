# Local development services. Start with: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: praying-mantis-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: praying_mantis
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    configs:
      # Scripts in /docker-entrypoint-initdb.d run only on the first start of an empty volume
      - source: create-test-database
        target: /docker-entrypoint-initdb.d/01-test-database.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailpit:
    # A fake mail server for local development: the backend sends to it over SMTP
    # (port 1025) and every email shows up in its web inbox at http://localhost:8025
    image: axllent/mailpit:latest
    container_name: praying-mantis-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:

configs:
  # Inline (not a bind-mounted file), so it works even where Docker can't read the repo folder
  create-test-database:
    content: |
      -- pytest drops and recreates this database, so the app user needs full rights on it
      CREATE DATABASE IF NOT EXISTS praying_mantis_test;
      GRANT ALL PRIVILEGES ON praying_mantis_test.* TO 'app'@'%';
