- description: nextjs-result-list
  vars:
    archetype: nextjs-frontend
    task: >-
      Review this synthetic React component. The errorMessage field is text returned by the API. Identify defects only. Code:
      "use client"; import { useEffect, useState } from "react"; import type { BatchResult } from "@/lib/types";
      export default function Results({ result }: { result: BatchResult }) { const [rows, setRows] = useState(result.payments);
      useEffect(() => { setRows(result.payments) }, [result]);
      function Row({ payment }: { payment: BatchResult["payments"][number] }) { return (<li><span>{payment.amount + " EUR"}</span>
      <span dangerouslySetInnerHTML={% raw %}{{ __html: payment.errorMessage }}{% endraw %} /></li>) }
      return <ul>{rows.map((payment) => <Row payment={payment} />)}</ul> }
