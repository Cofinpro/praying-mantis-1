- description: nextjs-api-client-and-test
  vars:
    archetype: nextjs-frontend
    task: >-
      Review this synthetic TypeScript API client and its vitest test. House rules: the backend address stays on the server,
      and tests inject a fake fetcher. api.ts: export async function validateBatch(batch: BatchSubmission,
      fetcher: typeof fetch = fetch): Promise<BatchValidation> { const response = await fetcher(
      `${process.env.NEXT_PUBLIC_BACKEND_URL}/api/batches/validate`, { method: "POST", body: JSON.stringify(batch) });
      return (await response.json()) as BatchValidation; }
      api.test.ts: it("validates a batch", async () => { const result = await validateBatch(sampleBatch);
      expect(result.acceptedCount).toBe(1) })
      Return exactly one JSON object whose findings array holds plain string ids, like {"findings":["first-id","second-id"]}.
      Every finding must be one of: missing-content-type, unchecked-http-status, test-reaches-network,
      backend-url-exposed-to-client, wrong-http-method. Do not use Markdown.
