# Ground truth for finding-classification evals in TransferGuard. Synthetic data only.
# vars: archetype (selects the skills) and task (the prompt).
# metadata: the closed taxonomy and the ground truth. Kept out of vars because promptfoo expands
# list-valued vars into one test per combination.
# vars are Nunjucks templates: a literal `{{` in code (JSX style objects, say) goes inside
# {% raw %}…{% endraw %}, which the model never sees.
#
# The frontend cases use this project's archetype, nextjs-frontend. Every archetype in
# opaidev/project.json needs at least one case.

- description: refinement-ambiguity
  vars:
    archetype: refinement
    task: >-
      Analyze this synthetic banking story: 'Create a screen that validates high-value transfer instructions before scheduling.' Identify only facts that must be decided before deterministic implementation. Return exactly one JSON object whose findings array holds plain string ids, like {"findings":["first-id","second-id"]}. Every finding must be one of: missing-currency, missing-limit, missing-timezone, missing-ui-color. Do not use Markdown.
  metadata:
    difficulty: easy
    allowedFindings: [missing-currency, missing-limit, missing-timezone, missing-ui-color]
    expectedFindings: [missing-currency, missing-limit, missing-timezone]
    criticalFindings: [missing-currency, missing-limit]
    minimumF1: 0.85

