- description: java-controller-and-validator
  vars:
    archetype: java-spring
    task: >-
      Review this synthetic Spring Boot 4 code. House rules: limits come from @ConfigurationProperties; business
      rejections are reason codes in a 200 response; there is no database. Code:
      @RestController class BatchController { @Autowired BatchValidator validator;
      @PostMapping("/api/batches/validate") ResponseEntity<BatchResponse> validate(@RequestBody BatchRequest request) {
      return ResponseEntity.ok(validator.validate(request)); } }
      @Service class BatchValidator { BatchResponse validate(BatchRequest request) { List<String> reasons = new ArrayList<>();
      if (request.executionDate().isBefore(LocalDate.now())) reasons.add("EXECUTION_DATE_IN_PAST");
      if (request.amount().equals(new BigDecimal("10000.00"))) reasons.add("AMOUNT_AT_LIMIT");
      return new BatchResponse(reasons); } }
      Identify defects only. Return exactly one JSON object whose findings array holds plain string ids, like
      {"findings":["first-id","second-id"]}. Every finding must be one of: bigdecimal-equals, untestable-clock,
      field-injection, missing-request-validation, hardcoded-limit, missing-transactional, wrong-http-status. Do not use Markdown.
  metadata:
    difficulty: medium
    allowedFindings: [bigdecimal-equals, untestable-clock, field-injection, missing-request-validation, hardcoded-limit, missing-transactional, wrong-http-status]
    expectedFindings: [bigdecimal-equals, untestable-clock, field-injection, missing-request-validation, hardcoded-limit]
    criticalFindings: [bigdecimal-equals, untestable-clock]
    minimumF1: 0.8

- description: java-iban-and-duplicates
  vars:
    archetype: java-spring
    task: >-
      Review this synthetic Java 21 code. Specification: end-to-end identifiers are compared case-insensitively;
      callers guarantee non-null values; returned lists are read-only by design. Code:
      static boolean validIban(String iban) { String rearranged = iban.substring(4) + iban.substring(0, 4);
      StringBuilder digits = new StringBuilder(); for (char c : rearranged.toUpperCase().toCharArray())
      digits.append(Character.isLetter(c) ? String.valueOf(c - 'A' + 10) : String.valueOf(c));
      return Long.parseLong(digits.toString()) % 97 == 1; }
      static List<String> duplicates(List<Payment> payments) { Set<String> seen = new HashSet<>();
      return payments.stream().map(Payment::endToEndId).filter(id -> !seen.add(id)).toList(); }
      Identify defects only. Return exactly one JSON object whose findings array holds plain string ids, like
      {"findings":["first-id","second-id"]}. Every finding must be one of: numeric-overflow, locale-sensitive-case,
      case-sensitive-duplicate-check, missing-null-check, unmodifiable-list-returned. Do not use Markdown.
  metadata:
    difficulty: hard
    allowedFindings: [numeric-overflow, locale-sensitive-case, case-sensitive-duplicate-check, missing-null-check, unmodifiable-list-returned]
    expectedFindings: [numeric-overflow, locale-sensitive-case, case-sensitive-duplicate-check]
    criticalFindings: [numeric-overflow, case-sensitive-duplicate-check]
    minimumF1: 0.85

